<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ofertas de Zapatillas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #f4f4f9;
      color: #333;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    header h1 {
      font-size: 2rem;
      color: #111;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
    }
    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background-color: #eee;
    }
    .card-body {
      padding: 15px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .title {
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .price-container {
      margin-bottom: 15px;
    }
    .old-price {
      text-decoration: line-through;
      color: #888;
      font-size: 0.85rem;
    }
    .price {
      font-size: 1.3rem;
      color: #00a650; /* Verde estilo Mercado Libre */
      font-weight: bold;
    }
    .btn {
      display: block;
      text-align: center;
      background-color: #3483fa;
      color: #fff;
      text-decoration: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      transition: background-color 0.2s ease;
    }
    .btn:hover {
      background-color: #2968c8;
    }
  </style>
</head>
<body>

  <header>
    <h1>🔥 Las Mejores Ofertas de Zapatillas</h1>
  </header>

  <main class="grid">

    <!-- PRODUCTO 1 -->
    <article class="card">
      <img src="https://http2.mlstatic.com/D_NQ_NP_2X_734240-MLA113410225817_062026-F.webp" alt="Zapatilla 1">
      <div class="card-body">
        <h2 class="title">Running Hombre Fila Progress Lite</h2>
        <div class="price-container">
          <span class="old-price">$84.899</span>
          <p class="price">$76.409,10</p>
        </div>
        <a href="https://meli.la/2Wmubi7" target="_blank" rel="noopener noreferrer" class="btn">Ver Oferta</a>
      </div>
    </article>

    <!-- PRODUCTO 2 -->
    <article class="card">
      <img src="URL_DE_LA_IMAGEN_2" alt="Zapatilla 2">
      <div class="card-body">
        <h2 class="title">Nombre de la Zapatilla 2</h2>
        <div class="price-container">
          <span class="old-price">$00.000</span>
          <p class="price">$00.000</p>
        </div>
        <a href="TU_LINK_DE_AFILIADO_2" target="_blank" rel="noopener noreferrer" class="btn">Ver Oferta</a>
      </div>
    </article>

  </main>

</body>
</html>
